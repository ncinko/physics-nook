<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#041018" />
    <title>Ripple Tank | Physics Nook</title>
    <meta name="description" content="Ripple Tank" />
  </head>
  <body>
    <main class="ripple-shell">
      <div class="water-backdrop" aria-hidden="true"></div>
      <canvas id="rippleCanvas" aria-label="Shared ripple tank canvas"></canvas>
      <div class="center-glow" aria-hidden="true"></div>
      <div class="edge-fade top" aria-hidden="true"></div>
      <div class="edge-fade bottom" aria-hidden="true"></div>

      <header class="ripple-topbar">
        <button id="tankSwitcherButton" class="ripple-title" type="button" aria-expanded="false" aria-controls="tankSwitcher">
          <strong id="playerCount">Users: 0</strong>
          <span id="roomLabel">TANK</span>
        </button>

        <div class="ripple-status">
          <div class="display-controls" aria-label="Display controls">
            <label class="control-slider">
              <span>Display sensitivity</span>
              <input id="sensitivityInput" type="range" min="0" max="160" step="1" value="72" />
            </label>
            <label class="control-toggle">
              <input id="gradientInput" type="checkbox" />
              <span>Gradient</span>
            </label>
          </div>
          <div class="action-group" aria-label="Ripple tank controls">
            <button id="themeButton" type="button" aria-label="Switch color theme">Dark</button>
            <button id="pauseButton" type="button" aria-label="Pause ripple simulation">Pause</button>
            <button id="resetButton" type="button" aria-label="Reset ripple tank">Reset</button>
          </div>
        </div>
      </header>

      <aside id="tankSwitcher" class="tank-switcher" aria-label="Ripple tanks" hidden>
        <div class="tray-heading">
          <strong>Ripple Tanks</strong>
        </div>
        <p id="lobbyNotice" class="lobby-notice" hidden>Choose a ripple tank to join.</p>
        <div id="tankButtons" class="tank-buttons"></div>
      </aside>

      <aside id="selectionPanel" class="selection-panel" aria-label="Selection controls" hidden>
        <div class="tray-heading">
          <strong id="selectionPanelTitle">Selection</strong>
          <button id="selectionCloseButton" class="panel-close-button" type="button" aria-label="Close selection controls">&times;</button>
        </div>
        <div id="emitterControls" class="panel-section">
          <label class="control-slider">
            <span>Amplitude</span>
            <input id="amplitudeInput" type="range" min="0" max="2.4" step="0.05" value="1.05" />
          </label>
          <label class="control-slider">
            <span>Frequency</span>
            <input id="frequencyInput" type="range" min="0.12" max="2.8" step="0.02" value="0.72" />
          </label>
          <label class="control-slider compact">
            <span>Phase</span>
            <input id="phaseInput" type="range" min="-6.283" max="6.283" step="0.05" value="0" />
          </label>
          <button id="enableButton" class="enable-button" type="button">Enabled</button>
        </div>
        <div id="objectControls" class="panel-section" hidden>
          <label class="control-slider">
            <span>Width</span>
            <input id="objectWidthInput" type="range" min="0.008" max="0.55" step="0.004" value="0.24" />
          </label>
          <label class="control-slider">
            <span>Height</span>
            <input id="objectHeightInput" type="range" min="0.008" max="0.55" step="0.004" value="0.035" />
          </label>
          <label id="objectGapControl" class="control-slider">
            <span>Opening</span>
            <input id="objectGapInput" type="range" min="0.006" max="0.28" step="0.002" value="0.1" />
          </label>
          <label id="objectSpacingControl" class="control-slider" hidden>
            <span>Spacing</span>
            <input id="objectSpacingInput" type="range" min="0.006" max="0.28" step="0.002" value="0.058" />
          </label>
          <button id="deleteButton" class="delete-button" type="button">Delete</button>
        </div>
      </aside>

      <aside class="object-tray" aria-label="Objects">
        <div class="tray-heading">
          <span>Objects</span>
        </div>
        <div class="object-buttons">
          <button class="object-button" type="button" data-object-kind="barrier" aria-label="Add rectangular barrier">
            <span class="object-icon barrier-icon" aria-hidden="true"></span>
          </button>
          <button class="object-button" type="button" data-object-kind="parabola" aria-label="Add parabolic reflector">
            <span class="object-icon parabola-icon" aria-hidden="true"></span>
          </button>
          <button class="object-button" type="button" data-object-kind="single-slit" aria-label="Add single slit barrier">
            <span class="object-icon slit-icon" aria-hidden="true"></span>
          </button>
          <button class="object-button" type="button" data-object-kind="double-slit" aria-label="Add double slit barrier">
            <span class="object-icon double-slit-icon" aria-hidden="true"></span>
          </button>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/ripple-main.ts"></script>
  </body>
</html>
