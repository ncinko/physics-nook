<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00080f" />
    <title>Manatee Royale</title>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Manatee Royale game view"></canvas>

      <header class="topbar">
        <div class="connection-pill" data-state="offline" id="connectionPill">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Offline</span>
        </div>
      </header>

      <section id="menuOverlay" class="menu-overlay">
        <div class="menu-panel">
          <div class="menu-heading">
            <canvas id="menuQueen" class="menu-queen" width="220" height="118" aria-hidden="true"></canvas>
            <canvas id="menuManatee" class="menu-manatee" width="150" height="82" aria-hidden="true"></canvas>
          </div>
          <label class="alias-field">
            <span>Name</span>
            <input id="nameInput" name="name" autocomplete="nickname" maxlength="8" placeholder="NAME" />
          </label>
          <div class="menu-actions">
            <button id="howToButton" type="button" class="how-to-button" aria-expanded="false" aria-controls="howToPanel">
              How to play
            </button>
            <button id="practiceButton" type="button" class="practice-button">Practice</button>
          </div>
          <div id="howToPanel" class="how-to-panel" hidden>
            <article class="how-to-card">
              <canvas id="howToDefeat" width="196" height="92" aria-hidden="true"></canvas>
              <span>defeat enemy queen</span>
            </article>
            <article class="how-to-card">
              <canvas id="howToPearls" width="196" height="92" aria-hidden="true"></canvas>
              <span>deliver pearls</span>
            </article>
            <article class="how-to-card">
              <canvas id="howToRide" width="196" height="92" aria-hidden="true"></canvas>
              <span>ride the manatee</span>
            </article>
          </div>
          <div id="lobbyCards" class="lobby-cards" aria-live="polite"></div>
        </div>
      </section>

      <section id="lobbyOverlay" class="lobby-overlay" hidden>
        <div class="lobby-panel">
          <header class="lobby-header">
            <div>
              <span id="playerCount" class="player-count">0/10</span>
              <h2 id="lobbyName">Lobby</h2>
              <p id="lobbyStatus">Choose a slot and ready up.</p>
            </div>
            <div class="lobby-actions">
              <button id="leaveButton" type="button" class="ghost-button">Leave</button>
              <button id="readyButton" type="button" class="ready-button">Ready</button>
            </div>
          </header>
          <div class="slot-board">
            <div class="team-slots team-blue">
              <h3>Blue</h3>
              <button type="button" data-slot="0"></button>
              <button type="button" data-slot="1"></button>
              <button type="button" data-slot="2"></button>
              <button type="button" data-slot="3"></button>
              <button type="button" data-slot="4"></button>
            </div>
            <div class="team-slots team-red">
              <h3>Red</h3>
              <button type="button" data-slot="5"></button>
              <button type="button" data-slot="6"></button>
              <button type="button" data-slot="7"></button>
              <button type="button" data-slot="8"></button>
              <button type="button" data-slot="9"></button>
            </div>
          </div>
        </div>
      </section>

      <section id="scoreOverlay" class="score-overlay" hidden>
        <div class="score-panel">
          <h2 id="scoreTitle">Round Complete</h2>
          <p id="scoreStats"></p>
          <strong id="scoreCountdown"></strong>
        </div>
      </section>

      <section id="practiceOverlay" class="practice-overlay" hidden>
        <div class="practice-panel">
          <span id="practicePhase">Worker</span>
          <strong id="practiceGoal">jump</strong>
          <p id="practiceFeedback">Complete the goal to continue.</p>
          <div class="practice-actions">
            <button id="practiceLeaveButton" type="button" class="ghost-button">Leave</button>
          </div>
        </div>
      </section>

      <nav class="touch-controls" aria-label="Movement controls">
        <button type="button" data-control="left" aria-label="Move left">&lt;</button>
        <button type="button" data-control="right" aria-label="Move right">&gt;</button>
        <button type="button" data-control="jump" aria-label="Jump">JUMP</button>
        <button type="button" data-control="down" aria-label="Drop down">DROP</button>
      </nav>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
