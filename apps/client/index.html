<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11120f" />
    <title>Physics Nook Arena</title>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Physics Nook Arena game view"></canvas>

      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-copy">
            <strong>Physics Nook Arena</strong>
            <span id="endpointText">ws://localhost:8788</span>
          </div>
        </div>

        <form id="joinForm" class="join-panel">
          <label>
            <span>Room</span>
            <input id="roomInput" name="room" autocomplete="off" maxlength="6" value="ARENA" />
          </label>
          <label>
            <span>Alias</span>
            <input id="nameInput" name="name" autocomplete="nickname" maxlength="18" placeholder="Player" />
          </label>
          <button id="joinButton" type="submit">Join</button>
        </form>

        <div class="connection-pill" data-state="offline" id="connectionPill">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Offline</span>
        </div>
      </header>

      <aside class="roster-panel" aria-live="polite">
        <div class="roster-heading">
          <span>Roster</span>
          <strong id="playerCount">0/10</strong>
        </div>
        <ol id="rosterList"></ol>
      </aside>

      <nav class="touch-controls" aria-label="Movement controls">
        <button type="button" data-control="left" aria-label="Move left">&lt;</button>
        <button type="button" data-control="right" aria-label="Move right">&gt;</button>
        <button type="button" data-control="jump" aria-label="Jump">JUMP</button>
      </nav>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
